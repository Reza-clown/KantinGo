<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KantinGO - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="global.css">
  <style>
    body { background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Inter', sans-serif; }
    .login-card { background: #fff; border-radius: 24px; padding: 2.5rem; width: 100%; max-width: 420px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
    .login-logo { display: flex; align-items: center; gap: 12px; margin-bottom: 2rem; justify-content: center; }
    .login-logo .logo-icon { width: 48px; height: 48px; background: #0d6efd; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 1.4rem; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon"><i class="bi bi-shop-window"></i></div>
      <div class="fw-bold fs-3 text-dark mb-0">Kantin<span class="text-primary">GO</span></div>
    </div>
    <h5 class="fw-bold text-center mb-1">Selamat Datang</h5>
    <p class="text-muted text-center small mb-4">Masuk ke sistem kasir KantinGO</p>

    <div id="alertMsg" class="alert alert-danger d-none" role="alert"></div>

    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label fw-semibold">Username</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
          <input type="text" class="form-control border-start-0" id="username" placeholder="username" required autofocus>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
          <input type="password" class="form-control border-start-0 border-end-0" id="password" placeholder="••••••" required>
          <button class="btn btn-light border border-start-0" type="button" id="togglePwd"><i class="bi bi-eye"></i></button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100 py-3 fw-bold rounded-pill" id="btnLogin">
        Masuk <i class="bi bi-arrow-right ms-2"></i>
      </button>
    </form>

    <p class="text-center text-muted small mt-4 mb-0">
      KantinGO &copy; 2025 · Sistem Kasir Modern
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
const API = location.origin + '/api';

    // Jika sudah login, redirect langsung
    if (localStorage.getItem('kg_token')) {
      const u = JSON.parse(localStorage.getItem('kg_user') || '{}');
      location.href = u.role === 'owner' ? 'Admin/admin-dashboard.html' : 'dashboard.html';
    }

    document.getElementById('togglePwd').addEventListener('click', function() {
      const pwd = document.getElementById('password');
      const isPass = pwd.type === 'password';
      pwd.type = isPass ? 'text' : 'password';
      this.innerHTML = `<i class="bi bi-eye${isPass ? '-slash' : ''}"></i>`;
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const alertEl  = document.getElementById('alertMsg');
      const btn      = document.getElementById('btnLogin');

      alertEl.classList.add('d-none');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Memproses...';

      try {
        const res  = await fetch(`${API}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();

        if (res.ok && data.data?.token) {
          localStorage.setItem('kg_token', data.data.token);
          localStorage.setItem('kg_user',  JSON.stringify(data.data.user));
          // Redirect sesuai role
          location.href = data.data.user.role === 'owner'
            ? 'Admin/admin-dashboard.html'
            : 'dashboard.html';
        } else {
          alertEl.textContent = data.message || 'Login gagal, periksa username dan password.';
          alertEl.classList.remove('d-none');
          btn.disabled = false;
          btn.innerHTML = 'Masuk <i class="bi bi-arrow-right ms-2"></i>';
        }
      } catch (err) {
        alertEl.textContent = 'Tidak dapat terhubung ke server. Pastikan server berjalan.';
        alertEl.classList.remove('d-none');
        btn.disabled = false;
        btn.innerHTML = 'Masuk <i class="bi bi-arrow-right ms-2"></i>';
      }
    });
  </script>
</body>
</html>
